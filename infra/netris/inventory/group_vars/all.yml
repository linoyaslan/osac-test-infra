# Netris Lab
netris_lab_dir: "{{ inventory_dir }}/../netris-lab"
ew_fabric_enable: 0
# Installation-level resolver for bare metal: configure-netris writes it to the
# Netris default DHCP option set (the lab's copy of the provider install step).
# VMs do not use it. Public upstream resolver; override where public DNS is
# blocked.
dns_server: "8.8.8.8"

# Netris Controller (URL is discovered dynamically by configure-netris role)
netris_username: "netris"
netris_password: "{{ lookup('ini', 'netris_password section=default file=' + config_path, errors='ignore') | default(lookup('env', 'NETRIS_PASSWORD'), true) }}"
netris_validate_certs: false

# Quay credentials for pulling private snapshot flavor images.
quay_username: "{{ lookup('ini', 'quay_username section=default file=' + config_path, errors='ignore') | default(lookup('env', 'QUAY_USERNAME'), true) }}"
quay_password: "{{ lookup('ini', 'quay_password section=default file=' + config_path, errors='ignore') | default(lookup('env', 'QUAY_PASSWORD'), true) }}"

# VM console root password (plain text — hashed at deploy time)
vm_root_password: "netris"

# OCP Server VM
ocp_vm_name_pattern: "hgx-pod00-su0-h00"
ocp_server_vcpu: 20
ocp_server_memory_gb: 64
ocp_install_disk_gb: 300
ocp_lvm_disk_gb: 300

# Netris Networking for OCP
ocp_vpc_name: "ocp-sno"
ocp_vnet_name: "ocp-sno-vnet"
ocp_subnet_cidr: "192.168.40.0/24"
ocp_gateway: "192.168.40.1/24"
ocp_node_ip: "192.168.40.2"
# Optional when Cloudsim's generated SSH aliases are unavailable.
ocp_vm_mgmt_ip: ""
ocp_snat_ip: "198.51.100.1"
ocp_dnat_ip: "198.51.100.2"
# Port 443 on the lab host belongs to the Netris K3s load balancer, so OCP
# routes (UI, Keycloak, AAP, console, fulfillment API) are published on this
# port by a socat forwarder. Keycloak and the UI advertise their URLs with this
# port, so tokens and browser redirects use it too.
ingress_forward_port: 9444

# Netris port identity is stable; h00 Linux interface names are resolved by MAC at runtime.
ocp_underlay_enabled: false
ocp_underlay_server_port: "eth10"
ocp_underlay_leaf_index: 1
ocp_underlay_leaf_port: "swp1s0"
ocp_underlay_p2p_cidr: "192.0.2.0/31"
ocp_underlay_ocp_asn: 4209999999

# Only the external_ip/ and references/ tests of tests/e2e/networking/vmaas
# allocate from this separate test-only range. The NAT and ExternalIP tests of
# the main VMaaS networking module use the routed 198.51.100.24/29 pool and run
# without ocp_vmaas_external_ip_*. The route for this RFC1918 prefix is
# deliberately not installed until the OCP/Netris/ISP path has a narrow,
# verified policy for it.
osac_vmaas_external_ip_pool_cidr: "172.27.0.0/16"

# OSAC tenant ExternalIPPool CIDR. The host routes this toward the softgate/ISP
# (see deploy-infra) so tenant ExternalIPs are reachable. Must not overlap the
# mgmt pools (nat_cidr 198.51.100.0/29, bgp_link 198.51.100.8/29,
# l4lb 198.51.100.16/29). OSAC creates the Netris allocation itself when a
# tenant ExternalIP is requested; the lab only prepares host routing/masquerade.
osac_external_ip_pool_cidr: "198.51.100.24/29"
osac_external_ip_pool_name: "netris-lab-public"

# Configuration file (INI format, optional — values fall back to env vars)
config_path: "{{ inventory_dir }}/../config"

# Lab identity (each user sets their own to avoid DNS collisions)
lab_name: "{{ lookup('ini', 'lab_name section=default file=' + config_path, errors='ignore') | default(lookup('env', 'LAB_NAME'), true) | default('default', true) }}"
dns_hosted_zone: "{{ lookup('ini', 'dns_hosted_zone section=default file=' + config_path, errors='ignore') | default(lookup('env', 'DNS_HOSTED_ZONE'), true) | default('ecoeng-osac-ci.devcluster.openshift.com', true) }}"

# OCP Installation
ocp_version: "4.22"
ocp_cluster_name: "ocp-sno"
ocp_base_domain: "{{ lab_name }}.{{ dns_hosted_zone }}"
pull_secret_path: "/root/pull-secret"
# Shared by Netris Ansible targets that run oc/kubectl; the Makefile passes KUBECONFIG here.
kubeconfig_path: "/root/.kube/config"
ssh_public_key_path: "/root/.ssh/id_rsa.pub"

# OSAC mono-repo
osac_repo: "https://github.com/osac-project/osac.git"
osac_branch: "main"
osac_dir: "/opt/osac"
osac_installer_dir: "{{ osac_dir }}/osac-installer"
osac_namespace: "osac-e2e-ci"
osac_test_tenant_name: "tenant1"
osac_values_file: "values/caas-ci/instance.yaml"

# Shared provider-networking provisioning gate for all OSAC consumers.
networking_provisioning_enabled: true
osac_license_path: "{{ inventory_dir }}/../license.zip"

# Container image overrides (leave empty to use installer defaults)
osac_operator_image: ""
fulfillment_service_image: ""
osac_aap_image: ""
osac_ui_image: ""
bmf_operator_image: ""

# AAP config-as-code project git overrides (leave empty to use installer defaults).
# Point AAP at a PR branch to test osac-aap playbook/collection changes; the
# mono-repo clone (osac_branch) only controls the installer Helm charts, not
# where AAP syncs its playbooks from at runtime.
aap_project_git_uri: ""
aap_project_git_branch: ""

# OCP snapshot restore. OSAC itself is always a fresh Helm install; the
# snapshot only provides the single-node OCP cluster.
snapshot_flavor_image: "quay.io/osac-project/cluster-flavors:sno-4-22"
snapshot_flavor_dir: "/var/cache/netris-lab/cluster-flavors/sno-4-22"
snapshot_recert_image: "quay.io/osac-project/recert:latest"
# Target OS disk size for every snapshot restore.
ocp_snapshot_disk_gb: 300

# AWS configuration for Route 53 DNS (read from config file or environment)
aws_access_key_id: "{{ lookup('ini', 'aws_access_key_id section=default file=' + config_path, errors='ignore') | default(lookup('env', 'AWS_ACCESS_KEY_ID'), true) }}"
aws_secret_access_key: "{{ lookup('ini', 'aws_secret_access_key section=default file=' + config_path, errors='ignore') | default(lookup('env', 'AWS_SECRET_ACCESS_KEY'), true) }}"
aws_region: "{{ lookup('ini', 'aws_region section=default file=' + config_path, errors='ignore') | default(lookup('env', 'AWS_DEFAULT_REGION'), true) | default('us-east-1', true) }}"

# CaaS cluster version -- must match a ClusterVersion present in the
# deployed fulfillment-service (metadata.name or spec.version).
caas_cluster_version: "{{ ocp_version }}.0"

# CaaS BMaaS worker pool and VM sizing
caas_worker_vm_patterns:
  - "hgx-pod00-su0-h01"
  - "hgx-pod00-su0-h02"
  - "hgx-pod00-su0-h03"
caas_worker_vcpu: 4
caas_worker_memory_mb: 16384
caas_worker_disk_gb: 100

caas_server_cluster_template_name: "ns-only"
caas_server_cluster_template_gateway: "192.168.101.1/24"
# CaaS Setup (BMaaS instance type, DiskImage and cluster creation)
# NetworkClass defaults for newly onboarded tenants (including plain BMaaS).
netris_tenant_network_cidr: "192.168.101.0/24"
netris_tenant_subnet_cidr: "192.168.101.0/24"
# One CaaS cluster per tenant subnet; keep the ingress VIP outside DHCP.
caas_netris_ingress_ip: "192.168.101.28"
caas_tenant_dhcp_start: "192.168.101.100"
caas_tenant_dhcp_end: "192.168.101.254"
caas_baremetal_instance_type: "ci-worker"
caas_baremetal_instance_type_profiles:
  - name: "ci-worker"
    title: "CI Worker"
    description: "4 vCPU / 16 GiB worker"
    cpu_cores: 4
    memory_total_gb: 16
  - name: "g5"
    title: "Simulated G5 Worker"
    description: "10 vCPU / 20 GiB worker"
    cpu_cores: 10
    memory_total_gb: 20
caas_baremetal_instance_type_fabric_port:
  name: "eth9"
  type: "Ethernet"
  speed: "100Gbps"
# Netris per-resource-class entry merged into cluster-fulfillment-ig
# NETRIS_RESOURCE_CLASS_MAP when the resource-class key is missing (setup-caas / setup-maas).
caas_netris_server_cluster_template_id: 2
caas_netris_mgmt_interface: "ens4"
caas_netris_vpc_interfaces:
  - "ens6"
caas_cluster_template: "osac.templates.ocp_small"
caas_catalog_item: "netris-ocp-small"
caas_catalog_item_title: "Netris OpenShift Small"
caas_catalog_item_description: "OpenShift cluster for CaaS testing on Netris"
caas_cluster_name: "caas-ci-cluster"
caas_worker_count: 1

# ── Bare metal services ──────────────────────────────────────────────
# Enables BMC network, sushy-tools, and BMF operator secrets.
# Required for both BMaaS and CaaS on bare metal.
bare_metal_services: false

# ── BMC network (shared infrastructure) ──────────────────────────────
# Dedicated libvirt network for Ironic ↔ sushy-tools communication.
# Avoids the br-mgmt VPN route conflict (OpenVPN pushes a route for
# 192.168.16.0/20 via tun0 that breaks direct L2 to the host).
bmc_net_name: "bmc-net"
bmc_net_bridge: "br-bmc"
bmc_net_host_ip: "10.99.0.1"
# Static DHCP lease reserved for the OCP management-cluster VM before it boots.
# Keep it at the edge of the subnet, outside the intended dynamic range.
bmc_net_ocp_ip: "10.99.0.254"
bmc_net_cidr: "10.99.0.0/24"
bmc_net_dhcp_start: "10.99.0.10"
bmc_net_dhcp_end: "10.99.0.50"

# ── sushy-tools (shared infrastructure) ──────────────────────────────
sushy_tools_ip: "{{ bmc_net_host_ip }}"
sushy_tools_port: 8000
sushy_tools_config_dir: "/etc/sushy-tools"
sushy_tools_disk_dir: "/tmp/virtual-bmh-disks"
sushy_tools_storage_pool: "bmh-disks"

# ── BMaaS ────────────────────────────────────────────────────────────
bmaas_vm_patterns:
  - "hgx-pod00-su0-h01"
  - "hgx-pod00-su0-h02"
  - "hgx-pod00-su0-h03"
# Stable management-network addresses used by the host-side BMaaS networking
# tests. These are deliberately independent of the bmc-net DHCP leases.
bmaas_ssh_hosts:
  hgx-pod00-su0-h01: "192.168.16.3"
  hgx-pod00-su0-h02: "192.168.16.4"
  hgx-pod00-su0-h03: "192.168.16.5"
bmaas_vm_vcpu: 4
bmaas_vm_memory_mb: 8192
bmaas_vm_disk_gb: 50
bmaas_bmh_namespace: "host-inventory"
# Stable BMH profile label; the default BMIT selects hosts with this value.
bmaas_bmit_name: "default"
# Standalone BMaaS setup keeps creating its own BMI template catalog by default.
bmaas_create_catalog_items: true
# Physical network interfaces of each simulated BM host. Tenants select a
# fabric interface by name in the BMI network attachment. Roles: fabric =
# tenant east-west data, lifecycle = PXE/BMC (not tenant-attachable). eth9 is
# the tenant data NIC on the sim-lab BMH VMs (see the Netris V-Net port).
bmaas_vm_interfaces:
  - name: eth9
    role: fabric
    type: Ethernet
    speed: 100Gbps
  - name: eth10
    role: fabric
    type: Ethernet
    speed: 400Gbps
  - name: eth0
    role: lifecycle
    type: Ethernet
    speed: 1Gbps
bmaas_bmi_template: "osac.templates.bm_host_provisioning"
bmaas_catalog_item: "ci-bm-default"
bmaas_catalog_item_title: "CI Default Bare Metal Instance"
bmaas_catalog_item_description: "Bare metal instance for CI testing"
bmaas_auto_eip_catalog_item: "ci-bm-auto-eip"
bmaas_auto_eip_catalog_item_title: "CI Bare Metal Instance with Auto External IP"
bmaas_auto_eip_catalog_item_description: "Bare metal instance with automatic ExternalIP attachment for CI testing"
# Persistent deploy-bmaas uses the same Fedora image as the BMaaS E2E tests.
bmaas_deploy_disk_image_name: "test-infra-fedora-bmi-44"
bmaas_deploy_disk_image_source_ref: "oci://quay.io/osac-project/fedora-cloud-bmi:44"
bmaas_deploy_tenants:
  - tenant1
  - tenant2
bmaas_deploy_bmi_name_prefix: "test-infra-bmi"

# ── BM provisioning V-Net ────────────────────────────────────────────
# Unassigned BM servers' fabric NIC (eth9) sits on this Netris V-Net, which has
# DHCP + a default gateway + SNAT, so the metal3 IPA has internet egress during
# inspection/cleaning (bmc-net stays isolated with no default route). The OSAC
# operator moves the port bm-provisioning -> tenant V-Net on provision and back
# on delete (bmf-operator env NETRIS_BM_PROVISIONING_VNET).
bmaas_provisioning_enabled: true
bmaas_provisioning_vnet_name: "bm-provisioning"
bmaas_provisioning_vpc_name: "bm-provisioning"
bmaas_provisioning_cidr: "10.98.0.0/24"
bmaas_provisioning_gateway: "10.98.0.1/24"
bmaas_provisioning_dhcp_start: "10.98.0.2"
# Exactly bmaas_vm_patterns-count addresses (3) — keeps VMs on .2/.3/.4 so the
# per-host 1:1 DNATs (sequential from dhcp_start) always match. A wider range
# lets stale leases push new VMs past the DNAT targets after destroy/recreate.
bmaas_provisioning_dhcp_end: "10.98.0.4"
bmaas_provisioning_fabric_iface: "eth9"   # must match bmaas_vm_interfaces fabric NIC
# External IP the provisioning SNAT maps egress to. Must be host-routed to the
# ISP (see deploy-infra) and not overlap the other 198.51.100.0/24 pools
# (nat .0/29, bgp .8/29, l4lb .16/29, tenant .24/29, ocp .1/.2, assisted .9).
bmaas_provisioning_snat_ip: "198.51.100.33"
bmaas_provisioning_snat_cidr: "198.51.100.32/29"
# The provisioning SNAT target must live in a Netris IPAM subnet with purpose
# "nat" (mirrors the mgmt "Public NAT Allocation"/"NAT pool" that backs
# ocp_snat_ip), created in the Default (system) VPC — id 1 — where the other
# NAT pools live.
bmaas_provisioning_snat_vpc_id: 1

# OpenShift CUDN EVPN inputs. The role validates a converged OCP 4.22
# OVNKubernetes cluster and the single-node underlay, then writes private
# installer values. osac-installer configures the OpenShift-side resources.
# The OCP cluster may use the virtualized `None` platform.
ocp_evpn_required_version: "4.22"

# The Netris underlay peer uses IPv4 unicast for PodNetwork advertisements;
# setup-vmaas verifies the BGPSessionState after the FRR peer is configured.
ocp_vmaas_external_ip_return_path_acknowledged: false
# The shared-subnet VMaaS/BMaaS dataplane test only advertises PodNetwork.
# Enable this only when the lab's separate ExternalIP route/return policy has
# also been configured and verified.
ocp_vmaas_external_ip_tests_enabled: false

# Dedicated RFC 2544 test range for this isolated lab's VTEP interface.
# The installer requires the fixed dummy interface name `evpn-vtep0`.
ocp_evpn_vtep_cidr: "198.18.0.0/24"
ocp_evpn_vtep_node_ip_cidr: "198.18.0.1/32"
ocp_evpn_vtep_dummy_interface: "evpn-vtep0"

# ── Netris Fabric Manager (VMaaS, OSAC networking contract) ──────────
# Suites whose NetworkClass selects the cudn_evpn Kubernetes Manager. The
# values/<profile>/netris.yaml overlay sets it (cudn_evpn for vmaas and full,
# "" for bmaas); caas-ci keeps its profile value. This list only feeds the
# prep-osac asserts.
netris_k8s_manager_suites: [vmaas, full]
# Netris private allocation of the lab; always in excludedIpv4Cidrs.
netris_private_allocation_cidr: "10.0.0.0/8"
# Extra IPv4 CIDRs for global.networking.excludedIpv4Cidrs. prep-osac always
# excludes all of 10.0.0.0/8 (the Netris private allocation of the lab, so
# tenant CIDRs must come from elsewhere: the E2E suites use 172.16-172.31
# except 172.27 and 172.30), the bare-metal DNS resolver, the node, management
# and BMC networks,
# the provisioning SNAT range, the VTEP CIDR, the Netris loopbacks and the node
# uplinks.
netris_extra_excluded_cidrs: []
