---
- name: Check the OSAC image overrides
  ansible.builtin.include_tasks: check_images.yml

- name: Require the Netris password
  ansible.builtin.assert:
    that:
      - netris_password is defined
      - netris_password | length > 0
    fail_msg: netris_password is empty; set it in the local config or NETRIS_PASSWORD.
  no_log: true

- name: Verify kubeconfig exists
  ansible.builtin.stat:
    path: "{{ kubeconfig_path | default('/root/.kube/config') }}"
  register: _kubeconfig
  failed_when: not _kubeconfig.stat.exists

- name: Validate OSAC checkout path
  ansible.builtin.assert:
    that:
      - osac_dir is string
      - osac_dir | trim is match('^/opt/[^./][^/]*/?$')
    fail_msg: "Refusing to remove unsafe OSAC checkout path '{{ osac_dir }}'; use a direct child of /opt."

- name: Remove previous OSAC checkout
  ansible.builtin.file:
    path: "{{ osac_dir }}"
    state: absent

- name: Clone osac
  ansible.builtin.git:
    repo: "{{ osac_repo }}"
    dest: "{{ osac_dir }}"
    version: "{{ osac_branch }}"
    force: true

# The lab Netris controller is reached over plain HTTP at its NodePort. The
# aap chart template rejects anything but https://, so relax it in the clone
# only. The task fails when the expected text is gone, so a chart change cannot
# silently undo the patch (compare upstream test-infra's schema patch).
- name: Allow HTTP Netris controller URL in the isolated lab
  ansible.builtin.replace:
    path: "{{ osac_dir }}/osac-aap/charts/aap/templates/config-as-code-secret.yaml"
    regexp: '\^https://\[\^/'
    replace: '^https?://[^/'
  register: _allow_http_netris
  failed_when: not _allow_http_netris.changed

- name: Determine values directory
  ansible.builtin.set_fact:
    _values_dir: "{{ osac_installer_dir }}/{{ osac_values_file | dirname }}"

- name: Ensure values directory exists
  ansible.builtin.file:
    path: "{{ _values_dir }}"
    state: directory
    mode: "0755"

# --- Discover Netris controller settings ---

- name: Discover Netris controller URL
  ansible.builtin.shell:
    cmd: kubectl get svc traefik -n kube-system -o jsonpath='{.spec.ports[?(@.name=="web")].nodePort}'
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: _traefik_nodeport
  changed_when: false
  until: _traefik_nodeport.rc == 0 and _traefik_nodeport.stdout | length > 0
  retries: 10
  delay: 15

- name: Set Netris controller URL
  ansible.builtin.set_fact:
    _netris_ctl_url: "http://192.168.16.254:{{ _traefik_nodeport.stdout }}"

- name: Get Netris site
  ansible.builtin.include_role:
    name: netris.controller.site
  vars:
    netris_controller_url: "{{ _netris_ctl_url }}"
    site_state: read

- name: Set site ID
  ansible.builtin.set_fact:
    _netris_site_id: "{{ netris_site_id }}"

- name: Get VPCs
  ansible.builtin.include_role:
    name: netris.controller.vpc
  vars:
    netris_controller_url: "{{ _netris_ctl_url }}"
    vpc_state: read

- name: Set OCP VPC ID
  ansible.builtin.set_fact:
    _netris_mgmt_vpc_id: "{{ netris_vpc_by_name[ocp_vpc_name].id }}"

- name: Get server cluster templates
  ansible.builtin.include_role:
    name: netris.controller.server_cluster_template
  vars:
    netris_controller_url: "{{ _netris_ctl_url }}"
    server_cluster_template_state: list

- name: Set server cluster template ID
  ansible.builtin.set_fact:
    _netris_sct_id: "{{ netris_sct_by_name[caas_server_cluster_template_name].id }}"

- name: Build resource class map
  ansible.builtin.set_fact:
    _netris_resource_class_map: >-
      {{ dict(caas_baremetal_instance_type_profiles | map(attribute='name')
              | zip([_netris_profile_network] * (caas_baremetal_instance_type_profiles | length))) }}
  vars:
    _netris_profile_network: >-
      {{ {'server_cluster_template_id': _netris_sct_id | int,
          'mgmt_interface': caas_netris_mgmt_interface,
          'vpc_interfaces': caas_netris_vpc_interfaces} }}

# --- Compute the networking contract inputs ---
#
# The Netris Fabric Manager registration (osac-network-fabric-manager-netris)
# and the cudn_evpn registration are rendered by the installer chart from
# global.networking; nothing is applied by hand. The lab supplies the manager
# settings (aap.instanceGroups.networkFulfillment) and the excluded ranges.

- name: Read the base profile values
  ansible.builtin.slurp:
    src: "{{ osac_installer_dir }}/{{ osac_values_file }}"
  register: _values_raw

- name: Check for the selected profile's Netris overlay
  ansible.builtin.stat:
    path: "{{ _values_dir }}/netris.yaml"
  register: _netris_overlay_stat

- name: Require a Netris overlay for the VMaaS, BMaaS and full suites
  ansible.builtin.assert:
    that:
      - _netris_overlay_stat.stat.exists
    fail_msg: >-
      DEPLOY_SUITE={{ deploy_suite }} requires values/{{ osac_profile }}/netris.yaml
      in the osac checkout (osac_branch={{ osac_branch }}). That commit predates
      the per-service Netris overlays; use a newer osac commit.
  when: deploy_suite | default('') in ['vmaas', 'bmaas', 'full']

- name: Read the Netris overlay
  ansible.builtin.slurp:
    src: "{{ _values_dir }}/netris.yaml"
  register: _netris_overlay_raw
  when: _netris_overlay_stat.stat.exists

# netris.yaml layers after instance.yaml, as in the Helm command. caas-ci has no
# overlay.
- name: Combine the base profile and the Netris overlay
  ansible.builtin.set_fact:
    _profile_values: >-
      {{ (_values_raw.content | b64decode | from_yaml)
         | combine(((_netris_overlay_raw.content | b64decode | from_yaml)
                    if _netris_overlay_stat.stat.exists else {}), recursive=true) }}

- name: Read full-ci infrastructure values
  when: deploy_suite | default('') == 'full'
  ansible.builtin.slurp:
    src: "{{ osac_installer_dir }}/{{ osac_values_file | dirname }}/infra.yaml"
  register: _full_ci_infra_values_raw

- name: Check for the EVPN host values written by deploy-ocp
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../.evpn-values.yaml"
  register: _evpn_values_stat

- name: Require the EVPN host values for the suites that use cudn_evpn
  ansible.builtin.assert:
    that:
      - _evpn_values_stat.stat.exists
    fail_msg: >-
      DEPLOY_SUITE={{ deploy_suite | default('') }} uses the cudn_evpn Kubernetes Manager, but
      {{ playbook_dir }}/../.evpn-values.yaml is missing; run make deploy-ocp
      DEPLOY_SUITE={{ deploy_suite | default('') }} first.
  when: deploy_suite | default('') in netris_k8s_manager_suites

- name: Read the EVPN host values written by deploy-ocp
  ansible.builtin.slurp:
    src: "{{ playbook_dir }}/../.evpn-values.yaml"
  register: _evpn_values_raw
  when: _evpn_values_stat.stat.exists

# The Netris private allocation (all of 10.0.0.0/8) is excluded as a whole, so
# no tenant network can take a 10.x address. Entries inside it stay listed:
# the chart and fulfillment accept overlapping entries.
# The excluded ranges hold the infrastructure networks, the
# bare-metal resolver (the Netris default DHCP option set hands dns_server to
# bare metal), the VTEP range, the fabric loopbacks and the node uplinks.
# ipaddr('subnet') keeps every entry canonical, also when an uplink address is
# not the network address.
- name: Compute the excluded IPv4 CIDRs
  ansible.builtin.set_fact:
    _netris_excluded_ipv4_cidrs: >-
      {{ (([dns_server ~ '/32', ocp_snat_ip ~ '/32', ocp_dnat_ip ~ '/32',
            ocp_subnet_cidr, '192.168.16.0/20', bmc_net_cidr,
            bmaas_provisioning_snat_cidr, netris_private_allocation_cidr]
           + ([_netris_evpn.vtepCIDR] if _netris_evpn.vtepCIDR is defined else [])
           + (_netris_evpn.bgp.acceptPrefixes | default([]))
           + (_netris_evpn.nodes | default([]) | map(attribute='uplinks') | flatten
              | map(attribute='address') | list)
           + netris_extra_excluded_cidrs)
          | map('ansible.utils.ipaddr', 'subnet') | unique | sort) }}
  vars:
    _netris_evpn: >-
      {{ (_evpn_values_raw.content | b64decode | from_yaml).evpn
         if _evpn_values_stat.stat.exists else {} }}

- name: Build the Netris Fabric Manager and cudn_evpn settings
  ansible.builtin.set_fact:
    _netris_manager_config: >-
      {{ {'NETRIS_CONTROLLER_URL': _netris_ctl_url,
          'NETRIS_USERNAME': netris_username,
          'NETRIS_VALIDATE_CERTS': 'false',
          'NETRIS_SITE_ID': _netris_site_id | string,
          'NETRIS_TENANT_ID': '1',
          'NETRIS_TENANT_NAME': 'Admin',
          'NETRIS_MGMT_VPC_ID': _netris_mgmt_vpc_id | string,
          'NETRIS_MGMT_VPC_NAME': ocp_vpc_name,
          'NETRIS_BM_PROVISIONING_VNET': bmaas_provisioning_vnet_name,
          'NETRIS_RESOURCE_CLASS_MAP': _netris_resource_class_map | to_json} }}

# --- Read SSH private key for instance group secrets ---

- name: Read SSH private key
  ansible.builtin.slurp:
    src: "{{ ssh_public_key_path | regex_replace('\\.pub$', '') }}"
  register: _ssh_private_key
  no_log: true

# --- Resolve OCP release CLI image ---

- name: Get CLI image from OCP release
  ansible.builtin.command:
    cmd: oc adm release info --image-for=cli
  environment:
    KUBECONFIG: "{{ kubeconfig_path | default('/root/.kube/config') }}"
  register: _ocp_cli_image
  changed_when: false

# --- Collect the lab values (written to netris-runtime.yaml below) ---

# Operator enablement (cnv, mce, metallb) is intentionally NOT overridden here:
# each values profile declares what it needs (e.g. bmaas-ci disables cnv/mce/metallb,
# vmaas-ci disables mce, caas-ci disables cnv). Force-enabling them clobbered the
# profile and installed CNV on BMaaS, whose golden-image DataVolumes filled the LVMS
# pool and starved the AAP postgres PVC. lvms/bundledPostgres stay overridden because
# every profile needs them.
# The runtime values set the shared networking provisioning flag from
# networking_provisioning_enabled, which defaults to true and can be
# overridden with EXTRA_VARS for the initial install. The lab has a real
# Netris controller.
# values/<profile>/netris.yaml selects the managers for vmaas,
# bmaas and full; caas-ci and its maas alias have no overlay and keep their
# k8sManager. These overrides hold what only the lab knows: the excluded ranges,
# the tenant defaults, and the manager settings and secrets in
# aap.instanceGroups.networkFulfillment. clusterFulfillment.config rejects keys
# outside its declared schema, so the BM provisioning V-Net stays only on
# networkFulfillment.
- name: Build values overrides
  ansible.builtin.set_fact:
    _values_overrides: >-
      {{ {'cliImage': _ocp_cli_image.stdout | trim,
          'bundledPostgres': {'enabled': true},
          'lvms': {'enabled': true},
          'global': {'networking': {
              'provisioningEnabled': networking_provisioning_enabled | bool,
              'fabricManager': 'netris',
              'excludedIpv4Cidrs': _netris_excluded_ipv4_cidrs,
              'networkClass': {'defaults': {
                'virtualNetworkIPv4CIDR': netris_tenant_network_cidr,
                'subnetIPv4CIDR': netris_tenant_subnet_cidr}}
            }},
          'operator': {'aap': {'tokenSecret': {'name': 'osac-aap-api-token', 'key': 'token'}}},
          'aap': {'instanceGroups': {'clusterFulfillment': {'enabled': true, 'config': {
              'NETRIS_USERNAME': netris_username,
              'NETRIS_SITE_ID': _netris_site_id | string,
              'NETRIS_TENANT_ID': '1',
              'NETRIS_TENANT_NAME': 'Admin',
              'EXTERNAL_ACCESS_BASE_DOMAIN': ocp_base_domain,
              'EXTERNAL_ACCESS_SUPPORTED_BASE_DOMAINS': ocp_base_domain,
              'EXTERNAL_ACCESS_API_INTERNAL_NETWORK': 'hypershift',
              'HOSTED_CLUSTER_BASE_DOMAIN': ocp_base_domain,
              'HOSTED_CLUSTER_CONTROLLER_AVAILABILITY_POLICY': 'SingleReplica',
              'HOSTED_CLUSTER_INFRASTRUCTURE_AVAILABILITY_POLICY': 'SingleReplica',
              'SERVER_MGMT_ROUTE_DESTINATION': '192.168.16.0/20',
              'SERVER_MGMT_ROUTE_GATEWAY': '192.168.16.1',
              'SERVER_SSH_BASTION_HOST': '192.168.16.254',
              'SERVER_SSH_BASTION_USER': 'root',
              'SERVER_SSH_USER': 'root',
              'DNS_CLASS': 'dns.route53.dns',
              'DNS_ZONE': dns_hosted_zone
            }, 'secret': {
              'AWS_ACCESS_KEY_ID': aws_access_key_id,
              'AWS_SECRET_ACCESS_KEY': aws_secret_access_key,
              'SERVER_SSH_KEY': _ssh_private_key.content | b64decode,
              'SERVER_SSH_BASTION_KEY': _ssh_private_key.content | b64decode
            }},
            'networkFulfillment': {'enabled': true, 'config': _netris_manager_config,
                                     'secret': {'NETRIS_PASSWORD': netris_password}}
          }}
         }
         | combine(({'aap': {'instanceGroups': {'clusterFulfillment': {
               'config': {
                 'NETRIS_MGMT_VPC_ID': _netris_mgmt_vpc_id | string,
                 'NETRIS_MGMT_VPC_NAME': ocp_vpc_name,
                 'NETRIS_RESOURCE_CLASS_MAP': _netris_resource_class_map | to_json,
                 'NETWORK_CLASS': 'netris',
                 'NETWORK_STEPS_COLLECTION': 'netris.steps'
               },
               'secret': {'NETRIS_PASSWORD': netris_password}
             }}}} if _caas_enabled else {}), recursive=true)
         | combine(({'operator': {'image': {
               'repository': osac_operator_image | regex_replace(':([^/]+)$', ''),
               'tag': (osac_operator_image | regex_search(':([^/]+)$', '\1') | first | default('latest')),
               'pullPolicy': ('IfNotPresent' if osac_operator_image.startswith('localhost/') else 'Always')
             }}} if osac_operator_image | default('') | length > 0 else {}), recursive=true)
         | combine(({'service': {'images': {'service': {
                       'repository': fulfillment_service_image | regex_replace(':([^/]+)$', ''),
                       'tag': (fulfillment_service_image | regex_search(':([^/]+)$', '\1') | first | default('latest')),
                       'pullPolicy': ('IfNotPresent' if fulfillment_service_image.startswith('localhost/') else 'Always')
                     }}},
                     'dbMigrate': {'image': fulfillment_service_image}}
                    if fulfillment_service_image | default('') | length > 0 else {}), recursive=true)
         | combine(({'aap': {'bootstrap': {'image': osac_aap_image}}}
                    if osac_aap_image | default('') | length > 0 else {}), recursive=true)
         | combine(({'ui': {'images': {'ui': osac_ui_image}}}
                    if osac_ui_image | default('') | length > 0 else {}), recursive=true)
         | combine(({'bmf': {'image': {
               'repository': bmf_operator_image | regex_replace(':([^/]+)$', ''),
               'tag': (bmf_operator_image | regex_search(':([^/]+)$', '\1') | first | default('latest')),
               'pullPolicy': ('IfNotPresent' if bmf_operator_image.startswith('localhost/') else 'Always')
             }}}
                    if bmf_operator_image | default('') | length > 0 else {}), recursive=true)
         | combine({'aap': {'configAsCode': {
               'projectGitUri': aap_project_git_uri | default(osac_repo, true),
               'projectGitBranch': aap_project_git_branch | default(osac_branch, true)}}}, recursive=true)
      }}
  vars:
    _caas_enabled: "{{ _profile_values.global.services.caas.enabled | default(false) | bool }}"
  no_log: true

# The forwarded ingress is reconciled after the install by the
# ingress-forward role, not from these values. The controller, the UI and the
# AAP jobs all fetch an issuer token while they start, and no pod can reach the
# forwarded port until the Keycloak host alias is on the Deployment. Setting
# :9444 here would make helm --wait deadlock on those pods. The install
# therefore starts on the chart's portless issuer, which every pod can reach,
# and the role flips the whole cluster to :9444 once the aliases exist.

# Keep bmf.metal3.enabled false here: it enables the BMF subchart's own Secret
# templates. The OSAC chart's testBackend templates provide those configs instead.
# The inventory namespace must be bmaas_bmh_namespace: setup-bmaas creates the
# virtual BareMetalHosts there, and the BMF operator lists hosts only in the
# namespace this override renders into the inventory secret. Pointing it at
# osac_namespace leaves the operator searching an empty namespace, so every
# BareMetalInstance fails with NoMatchingHosts.
- name: Configure the Metal3 test backend for bare-metal services
  when:
    - bare_metal_services | bool
    - _profile_values.global.services.bmaas.enabled | default(false) | bool
  ansible.builtin.set_fact:
    _values_overrides: >-
      {{ _values_overrides | combine({
           'bmf': {
             'metal3': {'enabled': false},
             'secrets': {
               'inventoryConfig': 'osac-inventory-config-metal3-test',
               'managementConfig': 'osac-management-config-metal3-test'
             },
             'testBackend': {'metal3': {'enabled': true, 'namespace': bmaas_bmh_namespace}}
           }
         }, recursive=true) }}
  no_log: true

- name: Disable cluster version seeding when CaaS is disabled
  # The seed hook calls the CaaS API, which returns 503 when CaaS is disabled.
  when: not (_profile_values.global.services.caas.enabled | default(true) | bool)
  ansible.builtin.set_fact:
    _values_overrides: >-
      {{ _values_overrides | combine({'clusterVersions': {'enabled': false}}, recursive=true) }}
  no_log: true

- name: Merge the profile values with the lab overrides
  ansible.builtin.set_fact:
    _final_values: "{{ _profile_values | combine(_values_overrides, recursive=true) }}"
  no_log: true

# Replaces the old assert on operator.networkManagers and networkClass, which no
# longer exist in the chart schema. The registrations and the NetworkClass are
# rendered by the installer from global.networking.
- name: Validate the networking contract of the final values
  ansible.builtin.assert:
    that:
      - (_final_values.global.networking.provisioningEnabled | bool) == (networking_provisioning_enabled | bool)
      - _final_values.global.networking.fabricManager == 'netris'
      - deploy_suite | default('') not in netris_k8s_manager_suites or _final_values.global.networking.k8sManager == 'cudn_evpn'
      - _final_values.global.networking.excludedIpv4Cidrs | length > 0
      - netris_private_allocation_cidr in _final_values.global.networking.excludedIpv4Cidrs
      - (netris_tenant_network_cidr | split('.'))[0] != '10'
      - (netris_tenant_subnet_cidr | split('.'))[0] != '10'
      - _final_values.aap.instanceGroups.networkFulfillment.enabled | bool
      - _final_values.aap.instanceGroups.networkFulfillment.config.NETRIS_CONTROLLER_URL | length > 0
      - _final_values.aap.instanceGroups.networkFulfillment.config.NETRIS_RESOURCE_CLASS_MAP | length > 0
      - deploy_suite | default('') != 'bmaas' or _final_values.global.networking.k8sManager == ''
    fail_msg: >-
      Profile {{ osac_profile }} must preserve the configured networking
      provisioning flag, select the
      Netris Fabric Manager (and cudn_evpn for DEPLOY_SUITE in
      {{ netris_k8s_manager_suites | join(', ') }}), exclude the lab ranges,
      and carry the Netris settings in aap.instanceGroups.networkFulfillment.
      Final global.networking: {{ _final_values.global.networking | to_json }}
  no_log: false

- name: Validate the VMaaS profile services
  ansible.builtin.assert:
    that:
      - _final_values.global.services.vmaas.enabled | default(false) | bool
      - _final_values.global.networking.k8sManager == 'cudn_evpn'
    fail_msg: >-
      Profile {{ osac_profile }} must enable VMaaS with the cudn_evpn Kubernetes Manager.
  when: deploy_suite | default('') == 'vmaas'

- name: Validate full-ci services
  when: deploy_suite | default('') == 'full'
  ansible.builtin.assert:
    that:
      - _final_values.global.services.caas.enabled | bool
      - _final_values.global.services.vmaas.enabled | bool
      - _final_values.global.services.bmaas.enabled | bool
      - _final_values.global.services.maas.enabled | bool
      - _final_values.aap.instanceGroups.storageFulfillment.enabled | bool
      - _final_values.metering.echoAdapter.enabled | bool
    fail_msg: >-
      DEPLOY_SUITE=full requires the full-ci profile
      services (CaaS, VMaaS, BMaaS, MaaS), storage fulfillment and the echo adapter.

# Helm reads instance.yaml, netris.yaml when the profile has one, then this
# file, so the committed profile stays untouched. It holds the AWS, SSH and
# Netris secrets: mode 0600, and never passed through --set.
- name: Write the generated Netris runtime values
  ansible.builtin.copy:
    dest: "{{ _values_dir }}/netris-runtime.yaml"
    content: "{{ _values_overrides | to_nice_yaml(indent=2) }}"
    mode: "0600"
  no_log: true

- name: Enable full-ci Keycloak test fixtures before the infrastructure install
  when: deploy_suite | default('') == 'full'
  ansible.builtin.copy:
    dest: "{{ osac_installer_dir }}/{{ osac_values_file | dirname }}/infra.yaml"
    content: >-
      {{ (_full_ci_infra_values_raw.content | b64decode | from_yaml)
         | combine({'keycloak': {'devFixtures': {'enabled': true}}}, recursive=true)
         | to_nice_yaml(indent=2) }}
    mode: "0600"
  no_log: true

# --- Copy files to values directory ---

- name: Copy AAP license file to values directory
  no_log: true
  ansible.builtin.copy:
    src: "{{ osac_license_path }}"
    dest: "{{ _values_dir }}/license.zip"
    remote_src: true
    mode: "0644"

- name: Copy pull secret to values directory
  no_log: true
  ansible.builtin.copy:
    src: "{{ pull_secret_path }}"
    dest: "{{ _values_dir }}/pull-secret.json"
    remote_src: true
    mode: "0644"

- name: Copy SSH keys for Netris integration
  no_log: true
  ansible.builtin.copy:
    src: "{{ ssh_public_key_path | regex_replace('\\.pub$', '') }}"
    dest: "{{ _values_dir }}/{{ item }}"
    remote_src: true
    mode: "0600"
  loop:
    - server-ssh-key
    - server-ssh-bastion-key

# --- Socat forwarder for OCP ingress ---

# Forwards the ingress port to OCP 443
- name: Create socat env file for OCP ingress
  ansible.builtin.copy:
    dest: /etc/netris-lab/socat/0.0.0.0-{{ ingress_forward_port }}.env
    mode: "0644"
    content: |
      BIND_IP=0.0.0.0
      PORT={{ ingress_forward_port }}
      TARGET_IP={{ ocp_dnat_ip }}
      TARGET_PORT=443

- name: Enable and start OCP ingress socat forwarder
  ansible.builtin.systemd:
    name: socat-forwarder@0.0.0.0-{{ ingress_forward_port }}
    state: started
    enabled: true
    daemon_reload: true

# --- Metal3 validation prerequisites ---

- name: Ensure Provisioning CR exists for Metal3 validation
  when: bare_metal_services | bool
  ansible.builtin.shell:
    cmd: |
      oc apply -f - <<EOF
      apiVersion: metal3.io/v1alpha1
      kind: Provisioning
      metadata:
        name: provisioning-configuration
      spec:
        provisioningNetwork: "Disabled"
        watchAllNamespaces: true
        disableVirtualMediaTLS: true
        provisioningIP: "{{ bmc_net_ocp_ip }}"
        externalIPs:
          - {{ bmc_net_ocp_ip }}
      EOF
  environment:
    KUBECONFIG: "{{ kubeconfig_path | default('/root/.kube/config') }}"
  register: _prov_cr
  changed_when: "'created' in _prov_cr.stdout or 'configured' in _prov_cr.stdout"

- name: Report OSAC preparation complete
  ansible.builtin.debug:
    msg: "OSAC prepared. Run 'make run-osac-setup' to install via Helm."
