---
- name: Discover Netris controller URL
  ansible.builtin.shell:
    cmd: kubectl get svc traefik -n kube-system -o jsonpath='{.spec.ports[?(@.name=="web")].nodePort}'
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: _traefik_nodeport
  changed_when: false
  until: _traefik_nodeport.rc == 0 and _traefik_nodeport.stdout | length > 0
  retries: 10
  delay: 15

- name: Set controller URL
  ansible.builtin.set_fact:
    netris_controller_url: "http://localhost:{{ _traefik_nodeport.stdout }}"

- name: Authenticate to Netris controller
  ansible.builtin.include_role:
    name: netris.controller.auth

# Verify the Netris North-South links against both ends of their libvirt tunnels
# before changing any Netris resources or snapshot disks.
- name: Resolve OCP uplink from Netris links and libvirt tunnels
  ansible.builtin.command:
    argv:
      - "{{ ansible_python_interpreter | default('/usr/bin/python3') }}"
      - "{{ playbook_dir }}/../scripts/ocp_uplink.py"
      - resolve
      - --controller-url
      - "{{ netris_controller_url }}"
      - --vm-name-pattern
      - "{{ ocp_vm_name_pattern }}"
      - --vnet-name
      - "{{ ocp_vnet_name }}"
      - --host-key
      - "{{ ssh_public_key_path | regex_replace('[.]pub$', '') }}"
      - --vm-mgmt-ip
      - "{{ ocp_vm_mgmt_ip | default('') }}"
  environment:
    NETRIS_SESSION_COOKIE: "{{ netris_session_cookie }}"
    NETRIS_VALIDATE_CERTS: "{{ (netris_validate_certs | default(false) | bool) | ternary('true', 'false') }}"
  register: _ocp_uplink_resolve
  changed_when: false
  failed_when: false
  no_log: true

- name: Stop if OCP uplink cannot be resolved
  ansible.builtin.fail:
    msg: OCP uplink resolution failed. Detailed process output was suppressed.
  when: _ocp_uplink_resolve.rc != 0

- name: Record resolved OCP uplink
  ansible.builtin.set_fact:
    _ocp_uplink: "{{ _ocp_uplink_resolve.stdout | from_json }}"
    ocp_vm_name: "{{ (_ocp_uplink_resolve.stdout | from_json).vm_name }}"
    ocp_uplink_mac: "{{ (_ocp_uplink_resolve.stdout | from_json).guest_mac }}"
    ocp_server_port: "{{ (_ocp_uplink_resolve.stdout | from_json).server_port }}"
    ocp_vm_mgmt_ip_resolved: "{{ (_ocp_uplink_resolve.stdout | from_json).management_ip }}"

- name: Build the single OCP VNet port
  ansible.builtin.set_fact:
    _ocp_server_ports:
      - name: "{{ ocp_server_port }}"
        accessMode: true

- name: Reject stale OCP server port override
  ansible.builtin.assert:
    that:
      - ocp_server_ports is not defined or ocp_server_ports == _ocp_server_ports
    fail_msg: >-
      ocp_server_ports conflicts with the verified OCP uplink. Remove the override.

# Point the Default DHCP option set at the lab's configurable DNS server. This
# option set is what every V-Net DHCP hands out (the OCP mgmt-cluster V-Net and
# the BMaaS provisioning V-Net included); Netris ships it with public resolvers
# (1.1.1.1/8.8.8.8), which are unreachable on labs that only allow an internal
# resolver — leaving DHCP clients (e.g. the metal3 IPA) unable to resolve quay.io.
- name: Get DHCP option sets
  no_log: true
  ansible.builtin.uri:
    url: "{{ netris_controller_url }}/api/v2/dhcp-option-set"
    method: GET
    headers:
      Cookie: "connect.sid={{ netris_session_cookie }}"
    status_code: 200
    validate_certs: "{{ netris_validate_certs | default(false) }}"
  register: _dhcp_option_sets

- name: Find default DHCP option set
  ansible.builtin.set_fact:
    _default_dhcp_option_set: >-
      {{ (_dhcp_option_sets.json.data | default([]))
         | selectattr('isDefault', 'equalto', true) | list | first | default({}) }}

- name: Set lab DNS server on the default DHCP option set
  no_log: true
  ansible.builtin.uri:
    url: "{{ netris_controller_url }}/api/v2/dhcp-option-set/{{ _default_dhcp_option_set.id }}"
    method: PUT
    headers:
      Cookie: "connect.sid={{ netris_session_cookie }}"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "{{ _default_dhcp_option_set.name }}"
      dnsServers: ["{{ dns_server }}"]
    status_code: [200]
    validate_certs: "{{ netris_validate_certs | default(false) }}"
  when: _default_dhcp_option_set.id is defined

- name: Create VPC for OCP
  ansible.builtin.include_role:
    name: netris.controller.vpc
  vars:
    vpc_name: "{{ ocp_vpc_name }}"
    vpc_state: present
    vpc_tenant_id: 1

- name: Create IPAM allocation for OCP
  ansible.builtin.include_role:
    name: netris.controller.ipam
  vars:
    ipam_state: create_allocation
    ipam_name: "{{ ocp_vpc_name }}-allocation"
    ipam_cidr: "{{ ocp_subnet_cidr }}"
    ipam_tenant_id: 1
    ipam_vpc_id: "{{ vpc_id }}"

- name: Create IPAM subnet for OCP
  ansible.builtin.include_role:
    name: netris.controller.ipam
  vars:
    ipam_state: create_subnet
    ipam_name: "{{ ocp_vpc_name }}-subnet"
    ipam_cidr: "{{ ocp_subnet_cidr }}"
    ipam_purpose: common
    ipam_site_id: 1
    ipam_tenant_id: 1
    ipam_vpc_id: "{{ vpc_id }}"

- name: Create VNet for OCP server
  ansible.builtin.include_role:
    name: netris.controller.vnet
  vars:
    vnet_name: "{{ ocp_vnet_name }}"
    vnet_state: present
    vnet_vpc_id: "{{ vpc_id }}"
    vnet_site_id: 1
    vnet_tenant_id: 1
    vnet_gateway: "{{ ocp_gateway }}"
    vnet_dhcp_enabled: false
    vnet_ports: "{{ _ocp_server_ports }}"

- name: Reconcile existing OCP VNet port with the resolved uplink
  ansible.builtin.command:
    argv:
      - "{{ ansible_python_interpreter | default('/usr/bin/python3') }}"
      - "{{ playbook_dir }}/../scripts/ocp_uplink.py"
      - reconcile
      - --controller-url
      - "{{ netris_controller_url }}"
      - --vnet-name
      - "{{ ocp_vnet_name }}"
      - --vpc-id
      - "{{ vpc_id | string }}"
      - --server-port
      - "{{ ocp_server_port }}"
  environment:
    NETRIS_SESSION_COOKIE: "{{ netris_session_cookie }}"
    NETRIS_VALIDATE_CERTS: "{{ (netris_validate_certs | default(false) | bool) | ternary('true', 'false') }}"
  register: _ocp_vnet_reconcile
  changed_when: _ocp_vnet_reconcile.rc == 0 and (_ocp_vnet_reconcile.stdout | from_json).changed | bool
  failed_when: false
  no_log: true

- name: Stop if the live OCP VNet does not match the uplink
  ansible.builtin.fail:
    msg: OCP VNet reconciliation failed. Detailed process output was suppressed.
  when: _ocp_vnet_reconcile.rc != 0

- name: Create SNAT rule for OCP VNet
  ansible.builtin.include_role:
    name: netris.controller.nat
  vars:
    nat_name: "{{ ocp_vpc_name }}-snat"
    nat_state: present
    nat_action: snat
    nat_site_id: 1
    nat_vpc_id: "{{ vpc_id }}"
    nat_source_address: "{{ ocp_subnet_cidr }}"
    nat_snat_to_ip: "{{ ocp_snat_ip }}"

# Covers both API and Ingress traffic
- name: Create DNAT rule for OCP
  ansible.builtin.include_role:
    name: netris.controller.nat
  vars:
    nat_name: "{{ ocp_vpc_name }}-dnat"
    nat_state: present
    nat_action: dnat
    nat_protocol: all
    nat_site_id: 1
    nat_vpc_id: "{{ vpc_id }}"
    nat_destination_address: "{{ ocp_dnat_ip }}/32"
    nat_dnat_to_ip: "{{ ocp_node_ip }}"

- name: Create ACL permit rule for mgmt cluster
  ansible.builtin.include_role:
    name: netris.controller.acl
    tasks_from: create
  vars:
    acl_name: "{{ ocp_vpc_name }}-permit-all"
    acl_action: permit
    acl_proto: all
    acl_vpc_id: "{{ vpc_id }}"
    acl_src_prefix: "{{ ocp_subnet_cidr }}"
    acl_dst_prefix: "0.0.0.0/0"
    acl_reverse: "yes"
    acl_comment: "Allow all traffic from mgmt cluster subnet"

- name: Check if NS-only server cluster template exists
  ansible.builtin.uri:
    url: "{{ netris_controller_url }}/api/v2/server-cluster-template"
    method: GET
    headers:
      Cookie: "connect.sid={{ netris_session_cookie }}"
    return_content: true
    validate_certs: false
  register: _sct_list
  no_log: true

- name: Create NS-only server cluster template for CaaS
  ansible.builtin.uri:
    url: "{{ netris_controller_url }}/api/v2/server-cluster-template"
    method: POST
    headers:
      Cookie: "connect.sid={{ netris_session_cookie }}"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "{{ caas_server_cluster_template_name }}"
      vnets:
        - postfix: "North-South"
          type: "l2vpn"
          vlan: "untagged"
          vlanID: "auto"
          serverNics: ["eth9"]
          ipv4Gateway: "{{ caas_server_cluster_template_gateway }}"
    validate_certs: false
    status_code: [200, 201]
  no_log: true
  when: _sct_list.json.data | selectattr('name', 'equalto', caas_server_cluster_template_name) | list | length == 0

- name: Report Netris networking configuration
  ansible.builtin.debug:
    msg: Netris networking configuration completed.
