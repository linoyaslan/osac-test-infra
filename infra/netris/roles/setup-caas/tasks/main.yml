---
- name: Require a configured BMaaS worker profile
  ansible.builtin.assert:
    that:
      - caas_baremetal_instance_type in (caas_baremetal_instance_type_profiles | map(attribute="name") | list)
    fail_msg: "No worker profile is configured for '{{ caas_baremetal_instance_type }}'."

- name: Validate requested worker count against the configured BMaaS worker pool
  ansible.builtin.assert:
    that:
      - caas_worker_count | int > 0
      - caas_worker_count | int <= caas_worker_vm_patterns | length
    fail_msg: >-
      caas_worker_count={{ caas_worker_count }} must be between 1 and
      {{ caas_worker_vm_patterns | length }}, the configured BMaaS worker count.

# Register BareMetalInstanceTypes, DiskImage and cluster catalog.
# Step 1: Register BareMetalInstanceTypes with selectors matching BMH profile labels
- name: Get fulfillment internal API URL
  ansible.builtin.shell:
    cmd: oc get route fulfillment-internal-api -n {{ osac_namespace }} -o jsonpath='{.status.ingress[0].host}'
  environment:
    KUBECONFIG: /root/.kube/config
  register: _fulfillment_host
  changed_when: false
  until: _fulfillment_host.rc == 0 and _fulfillment_host.stdout | length > 0
  retries: 10
  delay: 15

- name: Set fulfillment API URL
  ansible.builtin.set_fact:
    caas_fulfillment_api: "https://{{ _fulfillment_host.stdout }}"

# Must run before any osac CLI invocation in this role, including "Wait for
# cluster template to exist" below -- otherwise the CLI has no config yet
# ("Error: there is no configuration, run the 'login' command").
- name: Ensure osac CLI config directory exists
  ansible.builtin.file:
    path: /root/.config/osac
    state: directory
    mode: "0700"

- name: Configure osac CLI
  ansible.builtin.copy:
    content: |
      {
        "token_script": "oc create token -n {{ osac_namespace }} admin --duration 1h",
        "insecure": true,
        "address": "{{ _fulfillment_host.stdout }}:443"
      }
    dest: /root/.config/osac/config.json
    mode: "0600"

- name: Get service account token
  no_log: true
  ansible.builtin.shell:
    cmd: oc create token -n {{ osac_namespace }} admin
  environment:
    KUBECONFIG: /root/.kube/config
  register: _sa_token
  changed_when: false
  until: _sa_token.rc == 0 and _sa_token.stdout | length > 0
  retries: 10
  delay: 15

# OSAC creates the Netris IPAM allocation when the shared pool is reconciled.
# Tenant egress uses this shared pool; cluster API and ingress use the existing
# Netris external-access flow.
- name: List OSAC ExternalIPPools for tenant egress
  ansible.builtin.uri:
    url: "{{ caas_fulfillment_api }}/api/private/v1/external_ip_pools"
    method: GET
    headers:
      Authorization: "Bearer {{ _sa_token.stdout }}"
    validate_certs: false
    status_code: [200]
  register: _caas_external_ip_pools
  no_log: true

- name: Find the lab ExternalIPPool
  ansible.builtin.set_fact:
    _caas_external_pool_by_cidr: >-
      {{ _caas_external_ip_pools.json.get('items', [])
         | selectattr('spec.cidrs', 'equalto', [osac_external_ip_pool_cidr]) | list }}
    _caas_external_pool_by_name: >-
      {{ _caas_external_ip_pools.json.get('items', [])
         | selectattr('metadata.name', 'equalto', osac_external_ip_pool_name) | list }}

- name: Reject conflicting ExternalIPPool definitions
  ansible.builtin.assert:
    that:
      - _caas_external_pool_by_cidr | length <= 1
      - _caas_external_pool_by_name | length <= 1
      - >-
        (_caas_external_pool_by_name | length == 0) or
        ((_caas_external_pool_by_name | first).get('spec', {}).get('cidrs', []) == [osac_external_ip_pool_cidr])
    fail_msg: >-
      ExternalIPPool name/CIDR conflicts with the Netris lab configuration.

- name: Create the Netris lab ExternalIPPool when missing
  ansible.builtin.uri:
    url: "{{ caas_fulfillment_api }}/api/private/v1/external_ip_pools"
    method: POST
    headers:
      Authorization: "Bearer {{ _sa_token.stdout }}"
      Content-Type: application/json
    body_format: json
    body:
      metadata:
        name: "{{ osac_external_ip_pool_name }}"
      spec:
        cidrs: ["{{ osac_external_ip_pool_cidr }}"]
        ip_family: IP_FAMILY_IPV4
    validate_certs: false
    status_code: [200, 201]
  register: _caas_external_pool_created
  when: _caas_external_pool_by_cidr | length == 0
  no_log: true

- name: Select the Netris lab ExternalIPPool ID
  ansible.builtin.set_fact:
    _caas_external_pool_id: >-
      {{ (_caas_external_pool_by_cidr | first).id if _caas_external_pool_by_cidr | length > 0
         else (_caas_external_pool_created.json.get('object', _caas_external_pool_created.json)).id }}

- name: Wait for the Netris lab ExternalIPPool to be ready
  ansible.builtin.uri:
    url: "{{ caas_fulfillment_api }}/api/private/v1/external_ip_pools/{{ _caas_external_pool_id }}"
    method: GET
    headers:
      Authorization: "Bearer {{ _sa_token.stdout }}"
    validate_certs: false
    status_code: [200]
  register: _caas_external_pool_status
  until: >-
    (_caas_external_pool_status.json.get('object', _caas_external_pool_status.json)
      .get('status', {}).get('state', '')) in
    ['EXTERNAL_IP_POOL_STATE_READY', 'Ready']
  retries: 60
  delay: 10
  no_log: true

# OSAC auto-selects the ready pool with the most addresses. A second ready
# IPv4 pool could silently put cluster endpoints on an unrouted lab CIDR.
- name: List ready ExternalIPPools before CaaS cluster creation
  ansible.builtin.uri:
    url: "{{ caas_fulfillment_api }}/api/private/v1/external_ip_pools"
    method: GET
    headers:
      Authorization: "Bearer {{ _sa_token.stdout }}"
    validate_certs: false
    status_code: [200]
  register: _caas_external_pool_selection
  no_log: true

- name: Require the lab ExternalIPPool to be the only ready pool
  ansible.builtin.assert:
    that:
      - >-
        (_caas_external_pool_selection.json.get('items', [])
         | selectattr('status.state', 'in', ['EXTERNAL_IP_POOL_STATE_READY', 'Ready'])
         | rejectattr('id', 'equalto', _caas_external_pool_id) | list | length) == 0
    fail_msg: >-
      OSAC auto-selects an ExternalIPPool. Another ready pool could receive
      the cluster API and ingress addresses instead of {{ osac_external_ip_pool_cidr }}.

# Register the RHCOS OCI artifact and attach it to the ClusterVersion selected by deploy-caas.
- name: List OSAC DiskImages
  ansible.builtin.command: "osac --tenant shared get diskimages -o json"
  register: _caas_disk_images
  changed_when: false

- name: Find configured OSAC DiskImage
  vars:
    _disk_images: "{{ _caas_disk_images.stdout | from_json }}"
  ansible.builtin.set_fact:
    _caas_disk_image_matches: >-
      {{ (_disk_images.get('items', [_disk_images]) if _disk_images is mapping else _disk_images)
         | selectattr('metadata.name', 'equalto', caas_disk_image_name)
         | selectattr('metadata.tenant', 'equalto', 'shared') | list }}

- name: Validate existing OSAC DiskImage source
  ansible.builtin.assert:
    that:
      - _caas_disk_image_matches | length <= 1
      - >-
        (_caas_disk_image_matches | length == 0) or
        ((_caas_disk_image_matches | first).get('spec', {}).get('source_ref', '') == caas_disk_image_source_ref)
    fail_msg: >-
      DiskImage '{{ caas_disk_image_name }}' already exists with a different source_ref;
      choose a new name because DiskImage source references are immutable.

- name: Create OSAC DiskImage when missing
  ansible.builtin.command: >-
    osac --tenant shared create diskimage
    --name {{ caas_disk_image_name | quote }}
    --source-ref {{ caas_disk_image_source_ref | quote }}
    --source-type registry --guest-os-family linux --architecture amd64
  when: _caas_disk_image_matches | length == 0

- name: Get configured OSAC DiskImage
  ansible.builtin.command: "osac --tenant shared get diskimage {{ caas_disk_image_name | quote }} -o json"
  register: _caas_disk_image
  changed_when: false

- name: Resolve configured OSAC DiskImage
  ansible.builtin.set_fact:
    _caas_disk_image_resource: "{{ _caas_disk_image.stdout | from_json }}"

- name: List OSAC ClusterVersions
  ansible.builtin.command: "osac --tenant shared get clusterversions -o json"
  register: _caas_cluster_versions
  changed_when: false

- name: Find configured OSAC ClusterVersion
  vars:
    _cluster_versions: "{{ _caas_cluster_versions.stdout | from_json }}"
  ansible.builtin.set_fact:
    _caas_cluster_version_matches: >-
      {{ (_cluster_versions.get('items', [_cluster_versions]) if _cluster_versions is mapping else _cluster_versions)
         | selectattr('spec.version', 'equalto', caas_cluster_version) | list }}

- name: Require exactly one configured OSAC ClusterVersion
  ansible.builtin.assert:
    that:
      - _caas_cluster_version_matches | length == 1
    fail_msg: "Expected one OSAC ClusterVersion for {{ caas_cluster_version }}."

- name: Set OSAC ClusterVersion resource
  ansible.builtin.set_fact:
    _caas_cluster_version_resource: "{{ _caas_cluster_version_matches | first }}"

- name: Attach configured DiskImage to OSAC ClusterVersion
  no_log: true
  ansible.builtin.uri:
    url: "{{ caas_fulfillment_api }}/api/private/v1/cluster_versions/{{ _caas_cluster_version_resource.id }}?update_mask=spec.disk_image"
    method: PATCH
    headers:
      Authorization: "Bearer {{ _sa_token.stdout }}"
      Content-Type: "application/json"
    body_format: json
    body:
      id: "{{ _caas_cluster_version_resource.id }}"
      spec:
        disk_image:
          id: "{{ _caas_disk_image_resource.id }}"
          name: "{{ caas_disk_image_name }}"
    validate_certs: false
    status_code: [200]
  when: >-
    ((_caas_cluster_version_resource.get('spec', {}).get('disk_image') or {}).get('name', ''))
    != caas_disk_image_name

- name: Verify OSAC ClusterVersion DiskImage attachment
  ansible.builtin.command: "osac --tenant shared get clusterversion {{ _caas_cluster_version_resource.id | quote }} -o json"
  register: _caas_cluster_version_disk_image_check
  changed_when: false

- name: Require configured DiskImage on OSAC ClusterVersion
  ansible.builtin.assert:
    that:
      - (_caas_cluster_version_disk_image_check.stdout | from_json).get('spec', {}).get('disk_image', {}).get('name', '') == caas_disk_image_name
    fail_msg: >-
      ClusterVersion {{ caas_cluster_version }} is not linked to DiskImage {{ caas_disk_image_name }}.

- name: List OSAC BareMetalInstanceTypes
  no_log: true
  ansible.builtin.uri:
    url: "{{ caas_fulfillment_api }}/api/private/v1/bare_metal_instance_types"
    method: GET
    headers:
      Authorization: "Bearer {{ _sa_token.stdout }}"
    validate_certs: false
    status_code: [200]
  register: _caas_baremetal_instance_types

- name: Update existing BareMetalInstanceType host selectors
  no_log: true
  ansible.builtin.uri:
    url: "{{ caas_fulfillment_api }}/api/private/v1/bare_metal_instance_types/{{ _existing_type.id }}?update_mask=spec.host_label_selector"
    method: PATCH
    headers:
      Authorization: "Bearer {{ _sa_token.stdout }}"
      Content-Type: "application/json"
    body_format: json
    body:
      id: "{{ _existing_type.id }}"
      spec:
        host_label_selector:
          match_labels:
            osac.openshift.io/host-type: "{{ item.name }}"
    validate_certs: false
    status_code: [200]
  loop: "{{ caas_baremetal_instance_type_profiles }}"
  vars:
    _existing_type: >-
      {{ _caas_baremetal_instance_types.json.get('items', [])
         | selectattr('metadata.name', 'equalto', item.name) | list | first | default({}) }}
    _wanted_selector:
      match_labels:
        osac.openshift.io/host-type: "{{ item.name }}"
  when:
    - _existing_type | length > 0
    - _existing_type.spec.host_label_selector | default({}) != _wanted_selector

- name: Create OSAC BareMetalInstanceTypes when missing
  ansible.builtin.command: >-
    osac --tenant shared create baremetalinstancetype
    --name {{ item.name | quote }}
    --description {{ item.description | quote }}
    --cpu-cores {{ item.cpu_cores | int }}
    --cpu-architecture amd64 --cpu-threads-per-core 1
    --memory-total-gb {{ item.memory_total_gb | int }}
    --network-port {{ _caas_bmit_network_port | quote }}
    --host-label {{ _caas_bmit_host_label | quote }}
  vars:
    _caas_bmit_network_port: "{{ caas_baremetal_instance_type_fabric_port.name }}:fabric:{{ caas_baremetal_instance_type_fabric_port.type }}:{{ caas_baremetal_instance_type_fabric_port.speed }}"
    _caas_bmit_host_label: "osac.openshift.io/host-type={{ item.name }}"
  loop: "{{ caas_baremetal_instance_type_profiles }}"
  when: >-
    (_caas_baremetal_instance_types.json.get('items', [])
    | selectattr('metadata.name', 'equalto', item.name) | list | length) == 0

- name: Get available BMaaS worker hosts for the selected profile
  ansible.builtin.command:
    cmd: >-
      oc get bmh -n {{ bmaas_bmh_namespace }}
      -l osac.openshift.io/host-type={{ caas_baremetal_instance_type }}
      -o json
  environment:
    KUBECONFIG: /root/.kube/config
  register: _caas_worker_bmhs
  changed_when: false

- name: Set available BMaaS worker names
  ansible.builtin.set_fact:
    _caas_available_worker_names: >-
      {{ (_caas_worker_bmhs.stdout | from_json).get('items', [])
         | selectattr('metadata.name', 'in', caas_worker_vm_patterns)
         | rejectattr('metadata.deletionTimestamp', 'defined')
         | rejectattr('spec.consumerRef', 'defined')
         | selectattr('spec.online', 'equalto', true)
         | selectattr('status.provisioning.state', 'defined')
         | selectattr('status.provisioning.state', 'equalto', 'available')
         | map(attribute='metadata.name') | list }}

- name: Require enough available BMaaS workers for the requested cluster
  ansible.builtin.assert:
    that:
      - caas_worker_count | int <= _caas_available_worker_names | length
    fail_msg: >-
      Requested {{ caas_worker_count }} {{ caas_baremetal_instance_type }} workers,
      but only {{ _caas_available_worker_names | length }} configured workers are
      online, available, and labeled for that BMaaS profile:
      {{ _caas_available_worker_names }}.

# AAP netris.steps.cluster_network resolves the selected instance type through
# NETRIS_RESOURCE_CLASS_MAP. Keep both profile names available.
- name: Read NETRIS_RESOURCE_CLASS_MAP from cluster-fulfillment-ig
  ansible.builtin.shell:
    cmd: >-
      oc get configmap cluster-fulfillment-ig
      -n {{ osac_namespace }}
      -o jsonpath='{.data.NETRIS_RESOURCE_CLASS_MAP}'
  environment:
    KUBECONFIG: /root/.kube/config
  register: _netris_rc_map_raw
  changed_when: false

- name: Ensure worker profiles are present in NETRIS_RESOURCE_CLASS_MAP
  ansible.builtin.shell: |
    set -euo pipefail
    python3 <<'PY'
    import json, os, subprocess, sys

    raw = os.environ.get("NETRIS_RC_MAP_RAW", "").strip()
    if raw:
        try:
            data = json.loads(raw)
        except json.JSONDecodeError as exc:
            raise SystemExit(f"NETRIS_RESOURCE_CLASS_MAP is not valid JSON: {exc}")
        if not isinstance(data, dict):
            raise SystemExit("NETRIS_RESOURCE_CLASS_MAP must be a JSON object")
    else:
        data = {}

    names = json.loads(os.environ["NETRIS_RC_NAMES"])
    entry = {
        "server_cluster_template_id": int(os.environ["NETRIS_RC_TEMPLATE_ID"]),
        "mgmt_interface": os.environ["NETRIS_RC_MGMT_IF"],
        "vpc_interfaces": json.loads(os.environ["NETRIS_RC_VPC_IFS"]),
    }
    added = []
    for name in names:
        if name in data and isinstance(data[name], dict) and data[name]:
            continue
        data[name] = entry
        added.append(name)
    if not added:
        print("unchanged resource classes already in NETRIS_RESOURCE_CLASS_MAP")
        sys.exit(0)
    new_json = json.dumps(data, separators=(",", ":"))
    patch = json.dumps({"data": {"NETRIS_RESOURCE_CLASS_MAP": new_json}})
    subprocess.run(
        [
            "oc", "patch", "configmap", "cluster-fulfillment-ig",
            "-n", os.environ["NETRIS_RC_NS"],
            "--type=merge", "-p", patch,
        ],
        check=True,
    )
    print(f"patched added {','.join(added)}={json.dumps(entry)}")
    PY
  environment:
    KUBECONFIG: /root/.kube/config
    NETRIS_RC_NS: "{{ osac_namespace }}"
    NETRIS_RC_MAP_RAW: "{{ _netris_rc_map_raw.stdout | default('{}', true) | from_json | to_json }}"
    NETRIS_RC_NAMES: "{{ caas_baremetal_instance_type_profiles | map(attribute='name') | list | to_json }}"
    NETRIS_RC_TEMPLATE_ID: "{{ caas_netris_server_cluster_template_id | default(2) }}"
    NETRIS_RC_MGMT_IF: "{{ caas_netris_mgmt_interface | default('ens4') }}"
    NETRIS_RC_VPC_IFS: "{{ caas_netris_vpc_interfaces | default(['ens6']) | to_json }}"
  register: _netris_rc_map_ensure
  changed_when: "'patched ' in _netris_rc_map_ensure.stdout"

# Step 4: Trigger AAP publish-templates job and wait for cluster template
- name: Get AAP route
  ansible.builtin.shell:
    cmd: oc get route osac-aap -n {{ osac_namespace }} -o jsonpath='{.spec.host}'
  environment:
    KUBECONFIG: /root/.kube/config
  register: _aap_route
  changed_when: false
  until: _aap_route.rc == 0 and _aap_route.stdout | length > 0
  retries: 10
  delay: 15

- name: Get AAP admin password
  ansible.builtin.shell:
    cmd: oc get secret osac-aap-controller-admin-password -n {{ osac_namespace }} -o jsonpath='{.data.password}' | base64 -d
  environment:
    KUBECONFIG: /root/.kube/config
  register: _aap_admin_pw
  changed_when: false
  no_log: true

- name: Wait for publish-templates job template to be available
  ansible.builtin.uri:
    url: "https://{{ _aap_route.stdout }}/api/controller/v2/job_templates/?name=osac-publish-templates"
    method: GET
    user: admin
    password: "{{ _aap_admin_pw.stdout }}"
    force_basic_auth: true
    validate_certs: false
  register: _jt_check
  until: _jt_check.status == 200 and (_jt_check.json.count | default(0)) > 0
  retries: 40
  delay: 15
  no_log: true

- name: Wait for AAP gateway to be fully ready
  ansible.builtin.uri:
    url: "https://{{ _aap_route.stdout }}/api/controller/v2/ping/"
    method: GET
    user: admin
    password: "{{ _aap_admin_pw.stdout }}"
    force_basic_auth: true
    validate_certs: false
    status_code: [200]
  register: _gw_ping
  until: _gw_ping.status == 200
  retries: 20
  delay: 10
  no_log: true

- name: Launch publish-templates job
  no_log: true
  ansible.builtin.uri:
    url: "https://{{ _aap_route.stdout }}/api/controller/v2/job_templates/osac-publish-templates/launch/"
    method: POST
    user: admin
    password: "{{ _aap_admin_pw.stdout }}"
    force_basic_auth: true
    validate_certs: false
    status_code: [201]
  register: _publish_job
  retries: 5
  delay: 30
  until: _publish_job.status == 201

- name: Wait for publish-templates job to complete
  ansible.builtin.uri:
    url: "https://{{ _aap_route.stdout }}/api/controller/v2/jobs/{{ _publish_job.json.id }}/"
    method: GET
    user: admin
    password: "{{ _aap_admin_pw.stdout }}"
    force_basic_auth: true
    validate_certs: false
  register: _publish_status
  until: _publish_status.json.status in ['successful', 'failed', 'error', 'canceled']
  retries: 60
  delay: 15
  no_log: true

- name: Fail if publish-templates job did not succeed
  ansible.builtin.fail:
    msg: "publish-templates job {{ _publish_job.json.id }} finished with status: {{ _publish_status.json.status }}"
  when: _publish_status.json.status != 'successful'

- name: Wait for cluster template to exist
  ansible.builtin.command:
    cmd: osac get clustertemplates
  register: _templates
  until: caas_cluster_template in _templates.stdout
  retries: 30
  delay: 10
  changed_when: false

# Step 5: Create catalog item from template
- name: List OSAC cluster catalog items
  ansible.builtin.command: "osac --tenant shared get clustercatalogitems -o json"
  register: _caas_catalog_items
  changed_when: false

- name: Find configured OSAC cluster catalog item
  vars:
    _catalog_items: "{{ _caas_catalog_items.stdout | from_json }}"
  ansible.builtin.set_fact:
    _caas_catalog_item_matches: >-
      {{ (_catalog_items.get('items', [_catalog_items]) if _catalog_items is mapping else _catalog_items)
         | selectattr('metadata.name', 'equalto', caas_catalog_item) | list }}

- name: Validate existing OSAC cluster catalog item
  ansible.builtin.assert:
    that:
      - _caas_catalog_item_matches | length == 1
      - _caas_catalog_item_matches[0].template.id == caas_cluster_template
      - _caas_catalog_item_matches[0].published | default(false) | bool
    fail_msg: >-
      Cluster catalog item '{{ caas_catalog_item }}' already exists but does not
      reference the configured template as a published item.
  when: _caas_catalog_item_matches | length > 0

- name: Create cluster catalog item when missing
  ansible.builtin.command: >-
    osac --tenant shared create clustercatalogitem
    --name {{ caas_catalog_item | quote }}
    --title {{ caas_catalog_item_title | quote }}
    --description {{ caas_catalog_item_description | quote }}
    --template {{ caas_cluster_template | quote }}
    --published=true
  when: _caas_catalog_item_matches | length == 0
